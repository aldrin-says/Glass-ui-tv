name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SkyGlassLauncher-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GlassLauncher.apk
          gh release create "v1.0-${{ github.run_number }}" GlassLauncher.apk \
            --title "Glass Launcher APK" \
            --notes "Download GlassLauncher.apk and install it on your TV box."
